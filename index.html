<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedanaat Science Hub</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0f18;color:#e8eaf0;font-family:Inter,sans-serif;line-height:1.6}.hdr{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0d0f18;z-index:5;border-bottom:1px solid #1e2235}.logo{font-family:'Plus Jakarta Sans';font-weight:800;font-size:20px}.hero{margin:18px 20px;background:linear-gradient(135deg,#1a1d2d,#1e2235);border-radius:22px;padding:36px;border:1px solid #242845}.hero h1{font-family:'Plus Jakarta Sans';font-size:42px;font-weight:800}.y{color:#facc15}.search{margin-top:16px;background:#252a40;border:1px solid #343a5a;border-radius:12px;padding:12px 16px;width:100%;max-width:440px;color:#fff;outline:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:20px}.card{background:#171a2b;border-radius:18px;overflow:hidden;border:1px solid #242845;cursor:pointer;transition:.25s}.card:hover{transform:translateY(-4px);border-color:#4b5280;box-shadow:0 10px 30px rgba(0,0,0,.4)}.card img{width:100%;height:210px;object-fit:cover}.info{padding:14px}.tag{font-size:10px;background:#2a2f4a;padding:5px 10px;border-radius:20px;color:#9aa0b8}.info h3{font-size:15px;margin:8px 0 2px}.info p{font-size:12px;color:#7a819c}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:flex-start;z-index:99;overflow:auto;padding:20px}.modal-bg.on{display:flex}.modal{background:#151827;border-radius:20px;max-width:680px;width:100%;border:1px solid #2a2f4a;overflow:hidden;margin:20px 0}.modal img.main{width:100%;height:340px;object-fit:cover}.modal-body{padding:22px}.badge{display:inline-block;background:#1e2a3a;color:#2dd4ff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-right:8px}.price{background:#1a2e1a;color:#4ade80;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}.section{margin-top:20px;background:#1a1d2d;border-radius:14px;padding:16px;border:1px solid #242845}.section h4{font-size:14px;margin-bottom:10px}.comp{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #242845;font-size:13px}.step{display:flex;gap:12px;margin:12px 0}.step-num{background:#2dd4ff;color:#000;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}.close{float:right;background:#252a40;border:1px solid #343a5a;padding:8px 14px;border-radius:20px;cursor:pointer;color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="hdr"><div class="logo">🔬 Vedanaat Science Hub</div><div style="font-size:13px;color:#9aa0b8">For Science Exhibition 2024</div></div><div class="hero"><h1>Explore • Learn • <span class="y">Create.</span></h1><p style="color:#9aa0b8;margin-top:8px">Click any project for full step-by-step guide, price & parts list</p><input class="search" id="s" placeholder="Search projects - solar, robot, water..." oninput="filt()"></div><div class="grid" id="grid"></div><div class="modal-bg" id="m" onclick="if(event.target.id==='m')closeM()"><div class="modal"><div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#1a1d2d"><span style="font-size:13px;color:#9aa0b8">Full Project Guide</span><span class="close" onclick="closeM()">✕ Close</span></div><img class="main" id="mi"><div class="modal-body"><h2 id="mt" style="font-family:'Plus Jakarta Sans';font-size:24px"></h2><div style="margin:10px 0"><span class="badge" id="mc"></span><span class="price" id="mp"></span></div><p id="md" style="color:#b0b6cc;font-size:14px"></p><div class="section"><h4>🧩 Components Required</h4><div id="mcomp"></div></div><div class="section"><h4>🔨 Step-by-Step - Kaise Banayein</h4><div id="msteps"></div></div><div class="section" style="background:#1e2a1e;border-color:#2a4a2a"><h4>💡 Working Principle & Tips</h4><p id="mtip" style="font-size:13px;color:#9ab49a"></p></div></div></div></div><script>const projects=[{title:"Solar Powered Car",cat:"Physics - Renewable Energy",price:"₹250 - ₹400",img:"https://images.unsplash.com/photo-1511910849309-0dffb8785146?w=800",desc:"Mini solar car jo dhoop se chalti hai - bina battery ke! Solar exhibition ke liye best project.",components:[["Small Solar Panel 3V-6V","₹120","1 pcs"],["DC Motor 3V-6V","₹50","1 pcs"],["Cardboard / Plastic sheet","₹20","base ke liye"],["Small Wheels (4)","₹40","toy car se"],["Wires & Glue Gun","₹30",""],["Stick & Bottle Cap","₹10","axle ke liye"]],steps:["Cardboard ko car shape me kaato - 15cm x 10cm base banao","4 wheels ko 2 sticks (axle) pe lagao, base ke neeche tape se chipkao taaki ghume","DC Motor ko rear axle se jodo - rubber band ya gear se connection banao","Solar panel ko car ke upar lagao, uske 2 wire motor ke 2 wire se jodo (+ to +, - to -)","Dhoop me le jao - jaisi hi light padegi, motor chalega aur car aage jayegi!","Test: Agar ulta ghume to wire ulta karke jodo"],tip:"Photovoltaic effect: Solar panel light ko electricity me badalta hai. Jitni tez dhoop, utni tez car! 3V panel pe small motor hi use karo."},{title:"Hydraulic Robotic Arm",cat:"Robotics - Hydraulic",price:"₹150 - ₹300",img:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=800",desc:"Syringe se chalne wala robotic arm - bina electricity ke! Pascal's Law ka live demo.",components:[["Cardboard hard wala","₹30","big box"],["Syringes 10ml (8 pcs)","₹80","medical store se"],["Plastic tube / IV pipe","₹30","syringe jodne ke liye"],["Ice-cream sticks","₹20","joints ke liye"],["FeviQuick + Rubber bands","₹20",""],["Water + Colour","₹10","hydraulic fluid"]],steps:["Cardboard se arm ke 3 parts kaato - base, middle, gripper. Ice-stick se joint banao","Har joint pe 1 syringe lagao - ek push karega to arm move hoga","Syringe ko tube se dusre syringe se jodo, tube me coloured water bharo - air nahi hona chahiye","Base ko heavy banao taaki gire nahi - book pe chipka do","Ab bahar wale syringe ko push/pull karo - andar wala automatically move hoga","Chota ball uthane ki practice karo - exhibition me isse sabse zyada number milte hai"],tip:"Pascal's Law: Liquid pe pressure har jagah barabar jaata hai. JCB machine bhi isi principle pe chalti hai!"},{title:"3-Stage Water Filter",cat:"Environment - Best Seller",price:"₹100 - ₹200",img:"https://images.unsplash.com/photo-1611284446314-60a58ac0deb9?w=800",desc:"Ganda paani ko saaf karne wala filter - sand, charcoal, gravel se. Environment exhibition ka top project.",components:[["2-litre Plastic Bottle cut","₹10",""],["Fine Sand","₹20","1 cup"],["Activated Charcoal / Coal","₹40","crush karke"],["Gravel / Bajri","₹20","small stones"],["Cotton / Cloth","₹10","filter ke liye"]],steps:["Bottle ko beech se kaato, upar wala hissa ulta karke neeche wale me daalo - funnel banega","Neeche se upar: Pehle cotton, fir 2 inch charcoal, fir 2 inch fine sand, fir 2 inch gravel","Har layer ke baad thoda press karo taaki mix na ho","Upar se ganda paani dheere-dheere daalo - neeche saaf paani niklega","pH paper se test karke result dikhao to teacher khush ho jayega"],tip:"Filtration: Gravel bade kachre rokta hai, sand chote particles, charcoal smell aur chemicals. Real water plant bhi aise hi kaam karta hai."},{title:"Smart Home IoT",cat:"Electronics - Arduino",price:"₹800 - ₹1500",img:"https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=800",desc:"Mobile se ghar ki light, fan control - Arduino + Bluetooth se smart home.",components:[["Arduino Uno","₹500","main board"],["HC-05 Bluetooth Module","₹250",""],["4-Channel Relay Module","₹200",""],["Jumper Wires","₹50",""],["Bulb Holders + Bulbs","₹150","demo ke liye"]],steps:["Arduino me code daalo - YouTube pe 'Bluetooth Home Automation code' search karo","Relay ke COM ko bulb se, NO ko battery se, aur IN1, IN2 ko Arduino pin 2,3 se jodo","Bluetooth module ko Arduino se: VCC-5V, GND-GND, TX-RX, RX-TX","Mobile me Bluetooth Terminal app se HC-05 se connect karo, 1 bhejo to light ON, 0 bhejo to OFF","Cardboard ka chota ghar banao aur usme ye lights lagao"],tip:"IoT ka matlab Internet of Things. Relay ek switch hai jo Arduino ke signal se ON/OFF hota hai. Real smart home me WiFi use hota hai."}];const grid=document.getElementById('grid');function render(list){grid.innerHTML='';list.forEach((p,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><img src="${p.img}" loading="lazy"><div class="info"><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>${p.price} • Click for full guide →</p></div></div>`});}function openM(i){const p=projects[i];document.getElementById('mi').src=p.img;document.getElementById('mt').innerText=p.title;document.getElementById('mc').innerText=p.cat;document.getElementById('mp').innerText=p.price;document.getElementById('md').innerText=p.desc;document.getElementById('mcomp').innerHTML=p.components.map(c=>`<div class="comp"><span>${c[0]} <small style="color:#7a819c"> ${c[2]}</small></span><b style="color:#4ade80">${c[1]}</b></div>`).join('');document.getElementById('msteps').innerHTML=p.steps.map((s,idx)=>`<div class="step"><div class="step-num">${idx+1}</div><div style="font-size:13px">${s}</div></div>`).join('');document.getElementById('mtip').innerText=p.tip;document.getElementById('m').classList.add('on');window.scrollTo(0,0);}function closeM(){document.getElementById('m').classList.remove('on')}function filt(){const q=document.getElementById('s').value.toLowerCase();render(projects.filter(p=>p.title.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)))}render(projects);</script></body></html>
