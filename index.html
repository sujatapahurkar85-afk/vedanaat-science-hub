<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedanaat Science Hub - Fixed Photos</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0f18;color:#e8eaf0;font-family:Inter,sans-serif}.hdr{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:#0d0f18;border-bottom:1px solid #1e2235;position:sticky;top:0;z-index:10}.hero{margin:14px;background:#1a1d2d;border-radius:16px;padding:20px;border:1px solid #242845}.hero h1{font-size:28px;font-weight:800}.y{color:#facc15}.search{margin-top:10px;background:#252a40;border:1px solid #343a5a;border-radius:10px;padding:10px 14px;width:100%;max-width:500px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px}.card{background:#171a2b;border-radius:12px;overflow:hidden;border:1px solid #242845;cursor:pointer}.card img{width:100%;height:150px;object-fit:cover}.info{padding:8px}.tag{font-size:8px;background:#2a2f4a;padding:3px 6px;border-radius:8px;color:#9aa0b8}.info h3{font-size:11px;margin:4px 0}.info p{font-size:9px;color:#7a819c}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:flex-start;z-index:99;overflow:auto;padding:12px}.modal-bg.on{display:flex}.modal{background:#151827;border-radius:16px;max-width:600px;width:100%;border:1px solid #2a2f4a;overflow:hidden}.modal img.main{width:100%;height:250px;object-fit:cover}.modal-body{padding:14px}.close{float:right;background:#252a40;padding:5px 10px;border-radius:12px;cursor:pointer;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:400px){.grid{grid-template-columns:1fr}}</style></head><body><div class="hdr"><div style="font-weight:800">🔬 Vedanaat Science Hub</div><div id="count" style="font-size:11px;color:#4ade80">1000 Projects</div></div><div class="hero"><h1>Explore • Learn • <span class="y">Create.</span></h1><p style="font-size:11px;color:#9aa0b8">Fixed Photos - Har project ki sahi photo</p><input class="search" id="s" placeholder="Search solar, robot, water, volcano..." oninput="filt()"></div><div class="grid" id="grid"></div><div style="text-align:center;padding:16px"><button id="moreBtn" style="background:#2dd4ff;color:#000;border:0;padding:10px 20px;border-radius:20px;font-weight:700" onclick="loadMore()">Load More 100 ↓</button></div><div class="modal-bg" id="m" onclick="if(event.target.id==='m')closeM()"><div class="modal"><div style="padding:8px 12px;display:flex;justify-content:space-between;background:#1a1d2d"><span style="font-size:10px">Guide</span><span class="close" onclick="closeM()">✕ Close</span></div><img class="main" id="mi"><div class="modal-body"><h2 id="mt" style="font-size:16px"></h2><p id="md" style="font-size:11px;color:#b0b6cc;margin:6px 0"></p><div id="mcomp" style="font-size:11px;background:#1a1d2d;padding:8px;border-radius:8px"></div><div id="msteps" style="font-size:11px;margin-top:8px"></div></div></div></div><script>
function getImg(name){
 name=name.toLowerCase();
 if(name.includes("solar car")) return "https://images.unsplash.com/photo-1511910849309-0dffb8785146?w=600";
 if(name.includes("solar cooker")||name.includes("solar")) return "https://images.unsplash.com/photo-1509391366360-2e959784a276?w=600";
 if(name.includes("windmill")||name.includes("wind")) return "https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=600";
 if(name.includes("electromagnet")||name.includes("electromagnetic")) return "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=600";
 if(name.includes("hydraulic")) return "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600";
 if(name.includes("newton")) return "https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=600";
 if(name.includes("periscope")||name.includes("telescope")) return "https://images.unsplash.com/photo-1446776877081-d282a0f896e2?w=600";
 if(name.includes("generator")) return "https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=600";
 if(name.includes("robotic arm")||name.includes("robot")) return "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600";
 if(name.includes("line follower")||name.includes("obstacle")) return "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600";
 if(name.includes("water filter")||name.includes("water")) return "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?w=600";
 if(name.includes("rain")||name.includes("harvest")) return "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?w=600";
 if(name.includes("air pollution")||name.includes("pollution")) return "https://images.unsplash.com/photo-1611273426858-450d8e3c9fce?w=600";
 if(name.includes("volcano")) return "https://images.unsplash.com/photo-1506260408121-e353d10b87c7?w=600";
 if(name.includes("dna")||name.includes("biology")||name.includes("heart")||name.includes("blood")) return "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=600";
 if(name.includes("smart home")||name.includes("arduino")||name.includes("automatic")||name.includes("sensor")) return "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=600";
 if(name.includes("soap")||name.includes("chemistry")||name.includes("crystal")||name.includes("acid")) return "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600";
 if(name.includes("ai")||name.includes("face")||name.includes("voice")||name.includes("chatbot")) return "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600";
 return "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600";
}
const baseNames=["Solar Car","Solar Cooker","Windmill","Electromagnet","Hydraulic Lift","Newton Disc","Periscope","Telescope","Solar Tracker","AC Generator","Solar Water Heater","Electromagnetic Train","Robotic Arm","Line Follower Robot","Obstacle Avoider Robot","Pick and Place Robot","Humanoid Robot","Drone Quadcopter","Bluetooth Control Robot","Voice Control Robot","Fire Fighter Robot","Water Filter","Rainwater Harvesting","Water Level Indicator","Air Pollution Detector","Compost Making","Biogas Plant","Volcano Eruption","Acid Base Indicator","Soap Making","Crystal Growing","DNA Model","Human Heart Model","Photosynthesis Experiment","Smart Home IoT","Automatic Street Light","Fire Alarm System","Gas Leakage Detector","Face Detection AI","Voice Assistant","Chatbot Project"];
let projects=[];
for(let i=0;i<1000;i++){
 let b=baseNames[i%baseNames.length];
 let title=i<baseNames.length?b:b+" "+(i+1);
 let cat=b.includes("Solar")||b.includes("Wind")||b.includes("Electrom")||b.includes("Hydraulic")||b.includes("Newton")||b.includes("Periscope")||b.includes("Telescope")||b.includes("Generator")?"Physics":b.includes("Robot")||b.includes("Drone")||b.includes("Bluetooth")||b.includes("Voice")?"Robotics":b.includes("Water")||b.includes("Air")||b.includes("Compost")||b.includes("Biogas")?"Environment":b.includes("Smart")||b.includes("Automatic")||b.includes("Fire")||b.includes("Gas")?"Electronics":b.includes("DNA")||b.includes("Heart")||b.includes("Photo")||b.includes("Blood")?"Biology":b.includes("Volcano")||b.includes("Acid")||b.includes("Soap")||b.includes("Crystal")?"Chemistry":"AI & Tech";
 projects.push({title:title,cat:cat,price:`₹${150+(i*17)%700}`,img:getImg(b),desc:`${title} - ${cat} project. Step by step guide with low cost.`,comp:"Main Kit, Battery, Wires, Cardboard",steps:["Base banao","Parts fix karo","Wiring jodo","Test karo","Chart banao","Demo do"]});
}
let shown=100,filtered=projects;
const grid=document.getElementById('grid');
function render(list){grid.innerHTML='';list.slice(0,shown).forEach((p,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><img src="${p.img}" loading="lazy"><div class="info"><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>${p.price}</p></div></div>`});document.getElementById('count').innerText=filtered.length+" Projects • Showing "+Math.min(shown,list.length);}
function openM(i){const p=filtered[i];document.getElementById('mi').src=p.img;document.getElementById('mt').innerText=p.title;document.getElementById('md').innerText=p.desc;document.getElementById('mcomp').innerText="Parts: "+p.comp+" | "+p.price;document.getElementById('msteps').innerHTML=p.steps.map((s,idx)=>`<div><b>${idx+1}.</b> ${s}</div>`).join('');document.getElementById('m').classList.add('on');}
function closeM(){document.getElementById('m').classList.remove('on')}
function loadMore(){shown+=100;render(filtered);if(shown>=filtered.length)document.getElementById('moreBtn').style.display='none';}
function filt(){const q=document.getElementById('s').value.toLowerCase();filtered=q?projects.filter(p=>p.title.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)):projects;shown=100;render(filtered);document.getElementById('moreBtn').style.display=filtered.length>100?'block':'none';}
render(filtered);
</script></body></html>
