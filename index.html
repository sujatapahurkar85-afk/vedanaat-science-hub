<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedanaat Science Hub - Professional</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0f18;color:#e8eaf0;font-family:Inter,sans-serif;line-height:1.5}.hdr{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:#0d0f18;border-bottom:1px solid #1e2235;position:sticky;top:0;z-index:20}.btn{border:0;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer}.btn-blue{background:#2dd4ff;color:#000}.btn-green{background:#4ade80;color:#000}.hero{margin:14px;background:#1a1d2d;border-radius:16px;padding:20px;border:1px solid #242845}.hero h1{font-size:26px;font-weight:800}.y{color:#facc15}.search{margin-top:10px;background:#252a40;border:1px solid #343a5a;border-radius:10px;padding:10px 14px;width:100%;max-width:500px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px}.card{background:#171a2b;border-radius:12px;overflow:hidden;border:1px solid #242845;cursor:pointer}.card img{width:100%;height:140px;object-fit:cover}.info{padding:8px}.tag{font-size:8px;background:#2a2f4a;padding:3px 6px;border-radius:8px;color:#9aa0b8}.info h3{font-size:11px;margin:4px 0}.admin-bg,.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:flex-start;z-index:99;overflow:auto;padding:12px}.admin-bg.on,.modal-bg.on{display:flex}.panel{background:#151827;border-radius:16px;max-width:520px;width:100%;border:1px solid #2a2f4a;padding:18px;margin:20px 0}.input{width:100%;background:#252a40;border:1px solid #343a5a;border-radius:8px;padding:10px;color:#fff;margin:6px 0;font-size:12px}.label{font-size:11px;color:#9aa0b8;margin-top:8px;display:block}.modal{max-width:650px;width:100%;background:#151827;border-radius:16px;border:1px solid #2a2f4a;overflow:hidden}.modal img.main{width:100%;height:260px;object-fit:cover}.modal-body{padding:16px}.section{background:#1a1d2d;border-radius:10px;padding:12px;margin-top:12px;border:1px solid #242845}.close{float:right;background:#252a40;padding:6px 12px;border-radius:12px;cursor:pointer;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:400px){.grid{grid-template-columns:1fr}}</style></head><body><div class="hdr"><div style="font-weight:800">🔬 Vedanaat Science Hub</div><div style="display:flex;gap:8px"><span id="count" style="font-size:11px;color:#4ade80;align-self:center"></span><button class="btn btn-blue" onclick="openAdmin()">+ Admin Panel</button></div></div><div class="hero"><h1>Explore • Learn • <span class="y">Create.</span></h1><p style="font-size:11px;color:#9aa0b8">Professional Science Exhibition Guide - Standard Format</p><input class="search" id="s" placeholder="Search solar, robot, water, volcano..." oninput="filt()"></div><div class="grid" id="grid"></div><div style="text-align:center;padding:16px"><button id="moreBtn" class="btn btn-blue" onclick="loadMore()">Load More Projects ↓</button></div>

<div class="admin-bg" id="adminBg"><div class="panel"><div style="display:flex;justify-content:space-between"><h3>🔐 Admin Panel</h3><span style="cursor:pointer" onclick="closeAdmin()">✕</span></div><div id="loginDiv"><p style="font-size:11px;color:#9aa0b8;margin:8px 0">Password: vedanaat123</p><input class="input" id="pass" type="password" placeholder="Enter Password"><button class="btn btn-blue" style="width:100%;margin-top:8px" onclick="login()">Login as Admin</button></div><div id="adminDiv" style="display:none"><label class="label">Project Title *</label><input class="input" id="aTitle" placeholder="e.g. Hydraulic Robotic Arm"><label class="label">Category</label><select class="input" id="aCat"><option>Physics</option><option>Robotics</option><option>Environment</option><option>Electronics</option><option>Biology</option><option>Chemistry</option><option>AI & Tech</option></select><label class="label">Image URL *</label><input class="input" id="aImg" placeholder="https://...jpg - Right click image > Copy address"><label class="label">Estimated Cost</label><input class="input" id="aPrice" placeholder="₹250 - ₹400"><label class="label">Aim / Objective</label><input class="input" id="aAim" placeholder="e.g. To demonstrate Pascal's Law using syringes"><label class="label">Materials Required (comma separated)</label><textarea class="input" id="aMat" rows="2" placeholder="Hard cardboard, 10ml syringes x8, IV tubes, Fevicol, Coloured water"></textarea><label class="label">Procedure - Step by Step (one step per line)</label><textarea class="input" id="aSteps" rows="4" placeholder="1. Cut cardboard into three sections for base, arm and gripper&#10;2. Fix syringes at each joint using ice-cream sticks&#10;3. Connect syringes with tubes filled with coloured water without air bubbles"></textarea><label class="label">Working Principle</label><textarea class="input" id="aPrinciple" rows="2" placeholder="Pascal's Law: Pressure applied to enclosed liquid is transmitted equally..."></textarea><button class="btn btn-green" style="width:100%;margin-top:12px" onclick="addProject()">+ Add Project Professionally</button><div id="myList" style="margin-top:16px"></div><button class="btn" style="width:100%;margin-top:10px;background:#2a2f4a;color:#fff" onclick="closeAdmin()">Close Panel</button></div></div></div>

<div class="modal-bg" id="m"><div class="modal"><div style="padding:8px 12px;display:flex;justify-content:space-between;background:#1a1d2d"><span style="font-size:10px">Professional Project Report</span><span class="close" onclick="closeM()">✕ Close</span></div><img class="main" id="mi"><div class="modal-body"><h2 id="mt" style="font-size:18px"></h2><div style="margin:6px 0"><span id="mc" style="background:#1e2a3a;color:#2dd4ff;padding:4px 8px;border-radius:12px;font-size:10px"></span> <span id="mp" style="background:#1a2e1a;color:#4ade80;padding:4px 8px;border-radius:12px;font-size:10px"></span></div><div class="section"><h4 style="font-size:12px">🎯 Aim</h4><p id="mAim" style="font-size:12px;color:#b0b6cc"></p></div><div class="section"><h4 style="font-size:12px">🧩 Materials Required</h4><p id="mMat" style="font-size:12px;color:#b0b6cc"></p></div><div class="section"><h4 style="font-size:12px">🔨 Procedure - Step by Step</h4><div id="mSteps" style="font-size:12px;color:#b0b6cc"></div></div><div class="section" style="background:#1e2a1e"><h4 style="font-size:12px">💡 Working Principle</h4><p id="mPrinciple" style="font-size:12px;color:#9ab49a"></p></div></div></div></div>

<script>
function getImg(n){n=n.toLowerCase();if(n.includes("solar car"))return "https://images.unsplash.com/photo-1511910849309-0dffb8785146?w=600";if(n.includes("solar"))return "https://images.unsplash.com/photo-1509391366360-2e959784a276?w=600";if(n.includes("wind"))return "https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=600";if(n.includes("hydraulic"))return "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600";if(n.includes("robot"))return "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600";if(n.includes("water")||n.includes("filter"))return "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?w=600";if(n.includes("volcano"))return "https://images.unsplash.com/photo-1506260408121-e353d10b87c7?w=600";if(n.includes("dna")||n.includes("heart"))return "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=600";if(n.includes("smart")||n.includes("arduino"))return "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=600";if(n.includes("ai"))return "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600";return "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600";}
const defaultData=[
{title:"Solar Powered Car",cat:"Physics",price:"₹250 - ₹400",img:getImg("solar car"),aim:"To demonstrate conversion of solar energy into mechanical energy using photovoltaic effect.",mat:"3V-6V Solar panel (1), 3V DC motor (1), Cardboard sheet 15x10cm, Toy wheels x4, Wooden sticks for axles, Connecting wires, Glue gun",steps:["Construct a rectangular base of 15cm x 10cm using hard cardboard.","Mount four wheels on two wooden axles and fix them beneath the base ensuring free rotation.","Connect the DC motor to the rear axle using a rubber belt for torque transmission.","Mount the solar panel on the top surface and connect its terminals to the motor terminals with correct polarity.","Place the model in direct sunlight and observe forward motion. Reverse wires if rotation is opposite."],principle:"Photovoltaic Effect: Solar panel converts light energy into electrical energy. When photons strike the silicon cells, electrons are released creating potential difference that drives the motor. Higher intensity of light produces more power."},
{title:"Hydraulic Robotic Arm",cat:"Robotics",price:"₹150 - ₹300",img:getImg("hydraulic"),aim:"To demonstrate Pascal's Law and hydraulic power transmission using syringes.",mat:"Hard cardboard sheets, 10ml medical syringes x8, IV tubes / Plastic tubing 2m, Ice-cream sticks, Fevicol and rubber bands, Coloured water",steps:["Cut cardboard into three segments: Base (20cm), Middle arm (15cm), and Gripper (8cm). Create movable joints using ice-cream sticks.","Fix one syringe at each joint to act as hydraulic cylinder. One syringe acts as actuator, connected to another syringe via tubing.","Fill all tubes with coloured water ensuring no air bubbles remain, as air compresses and reduces efficiency.","Mount the arm on a heavy base to prevent toppling. Test each movement independently.","Demonstrate picking small objects using the gripper controlled by external syringes."],principle:"Pascal's Law: Pressure applied to an enclosed fluid is transmitted equally in all directions. When small syringe is pressed, pressure transmits through water to larger syringe causing mechanical movement. Real JCB and excavators work on same principle."},
{title:"3-Stage Water Filtration System",cat:"Environment",price:"₹100 - ₹200",img:getImg("water filter"),aim:"To design a low-cost multi-stage filtration system for purifying contaminated water.",mat:"2-litre plastic bottle, Fine sand 500g, Activated charcoal 300g, Gravel 300g, Cotton layer, Contaminated water sample",steps:["Cut the plastic bottle into two halves. Invert the upper half to form a funnel inside lower half.","Layer from bottom to top: Cotton plug, 2 inches activated charcoal, 2 inches fine sand, 2 inches gravel.","Compact each layer gently to prevent mixing and ensure uniform filtration.","Slowly pour contaminated water from top and collect filtered water below. Compare turbidity before and after.","Test pH and TDS if possible to show quantitative improvement in water quality."],principle:"Filtration and Adsorption: Gravel removes large suspended particles, sand removes fine particles, charcoal adsorbs chemicals, odour and some bacteria through activated carbon pores. This mimics municipal water treatment plant in small scale."},
{title:"Solar Cooker",cat:"Physics",price:"₹200 - ₹350",img:getImg("solar"),aim:"To demonstrate concentration of solar radiation for cooking using reflective surfaces.",mat:"Cardboard box, Aluminium foil, Black chart paper, Transparent polythene sheet, Thermocol",steps:["Line inner surface of cardboard box with aluminium foil with shiny side facing inside to reflect radiation.","Cover outer surface with black chart paper to absorb maximum heat.","Place cooking vessel painted black inside the box at focal point.","Cover box with transparent polythene to create greenhouse effect and prevent heat loss.","Place cooker in direct sunlight for 2-3 hours and observe temperature rise to 100°C+."],principle:"Greenhouse Effect and Reflection: Aluminium foil reflects solar rays to concentrate at centre, black surface absorbs radiation converting to heat, transparent cover traps heat inside by preventing convection. Temperature can reach 120°C sufficient to cook rice and vegetables."}
];
function loadCustom(){try{return JSON.parse(localStorage.getItem("vedanaat_pro")||"[]")}catch{return []}}
function saveCustom(a){localStorage.setItem("vedanaat_pro",JSON.stringify(a))}
let custom=loadCustom();
let projects=[...custom,...defaultData];
for(let i=defaultData.length;i<100;i++){let b=["Windmill","Electromagnet","Newton Disc","Telescope","Line Follower Robot","Obstacle Avoider Robot","Rainwater Harvesting","Air Pollution Detector","Volcano Model","DNA Model","Smart Home IoT","Fire Alarm","Face Detection AI","Voice Assistant"][i%14];projects.push({title:b+" Model "+(i+1),cat:"Physics",price:`₹${150+(i*13)%500}`,img:getImg(b),aim:`To study and demonstrate working of ${b} for science exhibition.`,mat:`${b} kit, Battery, Wires, Cardboard base`,steps:[`Design base structure of 20x15cm using cardboard`,`Assemble main components of ${b} as per circuit diagram`,`Connect power supply and test working`,`Prepare chart explaining working principle`,`Demonstrate working to judges with explanation`],principle:`${b} works on fundamental principle of ${b.includes("Wind")?"Wind energy conversion":b.includes("Robot")?"Robotics and sensors":b.includes("Water")?"Environmental science":"Physics"} demonstrating real-world application.`});}
let shown=100,filtered=projects;
const grid=document.getElementById('grid');
function render(list){grid.innerHTML='';list.slice(0,shown).forEach((p,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><img src="${p.img}" loading="lazy"><div class="info"><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>${p.price}</p></div></div>`});document.getElementById('count').innerText=projects.length+" Projects";document.getElementById('myList').innerHTML=custom.map((p,idx)=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid #222"><span>${p.title}</span><span style="color:#ff5a5a;cursor:pointer" onclick="deleteById('${p.id}')">Delete</span></div>`).join('')||"<p style='font-size:11px;color:#777'>No custom projects yet</p>";}
function openM(i){const p=filtered[i];document.getElementById('mi').src=p.img;document.getElementById('mt').innerText=p.title;document.getElementById('mc').innerText=p.cat;document.getElementById('mp').innerText=p.price;document.getElementById('mAim').innerText=p.aim;document.getElementById('mMat').innerText=p.mat;document.getElementById('mSteps').innerHTML=p.steps.map((s,idx)=>`<div style="margin:6px 0"><b>Step ${idx+1}:</b> ${s}</div>`).join('');document.getElementById('mPrinciple').innerText=p.principle;document.getElementById('m').classList.add('on');}
function closeM(){document.getElementById('m').classList.remove('on')}
function loadMore(){shown+=100;render(filtered);if(shown>=filtered.length)document.getElementById('moreBtn').style.display='none';}
function filt(){const q=document.getElementById('s').value.toLowerCase();filtered=q?projects.filter(p=>p.title.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)):projects;shown=100;render(filtered);}
function openAdmin(){document.getElementById('adminBg').classList.add('on')}
function closeAdmin(){document.getElementById('adminBg').classList.remove('on')}
function login(){if(document.getElementById('pass').value==="vedanaat123"){document.getElementById('loginDiv').style.display='none';document.getElementById('adminDiv').style.display='block';}else{alert("Wrong password! Use vedanaat123")}}
function addProject(){const t=document.getElementById('aTitle').value.trim();const img=document.getElementById('aImg').value.trim();if(!t||!img){alert("Title and Image URL required!");return;}const np={id:"c_"+Date.now(),title:t,cat:document.getElementById('aCat').value,price:document.getElementById('aPrice').value||"₹200",img:img,aim:document.getElementById('aAim').value||`To demonstrate ${t}`,mat:document.getElementById('aMat').value||"As per project",steps:(document.getElementById('aSteps').value||"Step 1, Step 2").split("\n").filter(s=>s.trim()),principle:document.getElementById('aPrinciple').value||"Scientific principle involved."};custom.unshift(np);saveCustom(custom);projects=[...custom,...defaultData];filtered=projects;alert("✅ Added Professionally! Now visible on site.");render(filtered);closeAdmin();}
function deleteById(id){custom=custom.filter(p=>p.id!==id);saveCustom(custom);projects=[...custom,...defaultData];filtered=projects;render(filtered);}
render(filtered);
</script></body></html>
