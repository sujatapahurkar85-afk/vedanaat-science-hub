<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedanaat Dashboard - 1000 Projects</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f7fb;font-family:Inter,sans-serif}.top{ background:#fff; border-bottom:1px solid #e2e8f0; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10 }.btn{border:0;padding:8px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:12px}.btn-blue{background:#1d4ed8;color:#fff}.grid{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px}.sidebar{background:#fff;border-radius:16px;padding:16px;border:1px solid #e2e8f0;height:fit-content;position:sticky;top:70px}.menu-item{padding:10px 12px;border-radius:10px;cursor:pointer;margin:4px 0;display:flex;gap:10px;align-items:center;font-size:13px}.menu-item.active{background:#1d4ed8;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border-radius:12px;padding:16px;border:1px solid #e2e8f0}.stat.blue{background:#3b82f6;color:#000}.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pcard{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;cursor:pointer}.pcard img{width:100%;height:130px;object-fit:cover}.admin-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:99;padding:20px}.admin-bg.on{display:flex}.panel{background:#fff;border-radius:20px;max-width:800px;width:100%;padding:20px;max-height:90vh;overflow:auto}.input{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:6px 0}.edit-row{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #f1f5f9;border-radius:10px;margin:6px 0;background:#f8fafc}.edit-row img{width:56px;height:56px;border-radius:8px;object-fit:cover}@media(max-width:800px){.grid{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div style="width:32px;height:32px;background:#1d4ed8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff">⚛️</div><b>Vedanaat Science Hub</b></div><div style="display:flex;gap:8px"><span style="font-size:11px;background:#dcfce7;color:#16a34a;padding:6px 10px;border-radius:20px">1000 Projects</span><button class="btn btn-blue" onclick="openAdmin()">⚙️ Admin Dashboard</button></div></div>
<div class="grid"><div class="sidebar"><div style="font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:12px">MENU</div><div class="menu-item active">🏠 Dashboard</div><div class="menu-item">📁 Projects</div><div class="menu-item">👥 Users</div><div class="menu-item">📊 Analytics</div><div class="menu-item">⚙️ Settings</div></div><div><div class="stats"><div class="stat blue"><div style="font-size:11px">Total Projects</div><div style="font-size:28px;font-weight:900">1000</div><div style="font-size:10px">+24 this week</div></div><div class="stat"><div style="font-size:11px">Active Projects</div><div style="font-size:28px;font-weight:900">842</div><div style="font-size:10px;color:#16a34a">+12 this week</div></div><div class="stat"><div style="font-size:11px">Pending Review</div><div style="font-size:28px;font-weight:900">158</div><div style="font-size:10px;color:#f59e0b">-3 from yesterday</div></div></div>
<div style="background:#fff;border-radius:16px;padding:16px;border:1px solid #e2e8f0;margin-bottom:16px;display:flex;gap:10px;justify-content:space-between;align-items:center"><input style="flex:1;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:10px" placeholder="Search projects by name, category, or ID..." id="s" oninput="filt()"><button class="btn btn-blue">+ Add New Project</button><button class="btn" style="background:#fff;border:1px solid #e2e8f0">⬇ Export CSV</button></div>
<div style="font-weight:800;margin-bottom:10px">Projects List</div><div class="pgrid" id="grid"></div></div></div>
<div class="admin-bg" id="adminBg"><div class="panel"><div style="display:flex;justify-content:space-between"><h3>🔐 Admin Dashboard - 1000 Projects</h3><span style="cursor:pointer" onclick="closeAdmin()">✕</span></div><div id="loginDiv"><input class="input" id="pass" type="password" placeholder="Password = Vedanta026"><button class="btn btn-blue" style="width:100%;margin-top:10px" onclick="login()">Login</button><p id="err" style="color:#ef4444;font-size:11px;display:none">❌ Wrong!</p></div><div id="adminDiv" style="display:none"><input class="input" id="editSearch" placeholder="Search project..." oninput="renderEditList()"><div id="editList" style="max-height:400px;overflow:auto;margin-top:10px"></div><button class="btn" style="width:100%;margin-top:10px;background:#fff;border:1px solid #e2e8f0" onclick="logout()">Logout</button></div></div></div>
<script>
const ADMIN_PASS="Vedanta026";
function getImg(n){n=n.toLowerCase();if(n.includes("solar"))return "https://images.unsplash.com/photo-1509391366360-2e959784a276?w=600";if(n.includes("wind"))return "https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=600";if(n.includes("hydraulic"))return "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600";return "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600";}
const baseNames=["Solar Car - Renewable Energy prototype","Windmill - Small Scale Wind Turbine","Hydraulic Lift - Fluid Mechanics Demo","Electromagnet - Simple Circuit","Solar Cooker - Thermal Energy","Robotic Arm - Arduino Project","Water Filter - Purification","Volcano Eruption - Chemical Reaction","DNA Model - Biology","Smart Home IoT"];
let baseProjects=[];for(let i=0;i<1000;i++){let b=baseNames[i%baseNames.length];baseProjects.push({id:"base_"+i,title:b,img:getImg(b),cat:"Science"});}
let edits={};try{edits=JSON.parse(localStorage.getItem("vedanaat_dash")||"{}")}catch{}
function apply(list){return list.map(p=>{if(edits[p.id])p.img=edits[p.id];return p;});}
baseProjects=apply(baseProjects);
let filtered=baseProjects;
const grid=document.getElementById('grid');
function render(list){grid.innerHTML='';list.slice(0,30).forEach((p,i)=>{grid.innerHTML+=`<div class="pcard" onclick="alert('${p.title}')"><img src="${p.img}"><div style="padding:10px"><div style="font-size:11px;font-weight:700">${p.title}</div><div style="font-size:9px;color:#64748b">ID: PRJ-${10234+i} • Category: Renewable Energy • Status: ${i%3==0?'Pending':'Active'}</div><div style="display:flex;gap:6px;margin-top:8px"><button style="font-size:9px;background:#1d4ed8;color:#fff;border:0;padding:5px 10px;border-radius:20px">✏️ Edit Photo</button><button style="font-size:9px;background:#fff;border:1px solid #1d4ed8;color:#1d4ed8;padding:5px 10px;border-radius:20px">🎥 Edit Video</button><button style="font-size:9px;background:#fff;border:1px solid #1d4ed8;color:#1d4ed8;padding:5px 10px;border-radius:20px">+ 2nd Video</button></div></div></div>`});}
function filt(){const q=document.getElementById('s').value.toLowerCase();filtered=q?baseProjects.filter(p=>p.title.toLowerCase().includes(q)):baseProjects;render(filtered);}
function openAdmin(){document.getElementById('adminBg').classList.add('on');renderEditList();}
function closeAdmin(){document.getElementById('adminBg').classList.remove('on')}
function login(){if(document.getElementById('pass').value===ADMIN_PASS){document.getElementById('loginDiv').style.display='none';document.getElementById('adminDiv').style.display='block';}else{document.getElementById('err').style.display='block';}}
function logout(){document.getElementById('loginDiv').style.display='block';document.getElementById('adminDiv').style.display='none';closeAdmin();}
function renderEditList(){const q=(document.getElementById('editSearch').value||"").toLowerCase();let list=filtered;if(q)list=filtered.filter(p=>p.title.toLowerCase().includes(q));document.getElementById('editList').innerHTML=list.slice(0,50).map(p=>`<div class="edit-row"><img src="${p.img}"><div style="flex:1"><b style="font-size:12px">${p.title}</b><div style="font-size:10px;color:#64748b">ID: PRJ-10234 • Published</div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn btn-blue" style="font-size:9px" onclick="editPhoto('${p.id}')">Edit Photo</button><button class="btn" style="font-size:9px;background:#fff;border:1px solid #1d4ed8" onclick="editPhoto('${p.id}')">Edit Video</button></div></div>`).join('');}
function editPhoto(id){const url=prompt("New Photo URL:");if(!url)return;edits[id]=url;localStorage.setItem("vedanaat_dash",JSON.stringify(edits));baseProjects=apply(baseProjects);filtered=baseProjects;render(filtered);renderEditList();alert("✅ Updated!");}
render(filtered);
</script></body></html>
