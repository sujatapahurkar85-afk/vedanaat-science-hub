<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedanaat Science Hub - 1000 Projects</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0f18;color:#e8eaf0;font-family:Inter,sans-serif}.hdr{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:#0d0f18;border-bottom:1px solid #1e2235;position:sticky;top:0;z-index:5}.hero{margin:16px;background:#1a1d2d;border-radius:18px;padding:24px;border:1px solid #242845}.hero h1{font-size:32px;font-weight:800}.y{color:#facc15}.search{margin-top:12px;background:#252a40;border:1px solid #343a5a;border-radius:10px;padding:10px 14px;width:100%;max-width:500px;color:#fff}.stats{display:flex;gap:12px;margin-top:12px;font-size:12px;color:#9aa0b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px}.card{background:#171a2b;border-radius:14px;overflow:hidden;border:1px solid #242845;cursor:pointer}.card img{width:100%;height:140px;object-fit:cover}.info{padding:10px}.tag{font-size:9px;background:#2a2f4a;padding:4px 8px;border-radius:12px;color:#9aa0b8}.info h3{font-size:13px;margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:10px;color:#7a819c}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:flex-start;z-index:99;overflow:auto;padding:16px}.modal-bg.on{display:flex}.modal{background:#151827;border-radius:18px;max-width:600px;width:100%;border:1px solid #2a2f4a;overflow:hidden;margin:10px 0}.modal img.main{width:100%;height:260px;object-fit:cover}.modal-body{padding:18px}.badge{background:#1e2a3a;color:#2dd4ff;padding:5px 10px;border-radius:16px;font-size:11px}.price{background:#1a2e1a;color:#4ade80;padding:5px 10px;border-radius:16px;font-size:11px}.section{margin-top:16px;background:#1a1d2d;border-radius:12px;padding:12px;border:1px solid #242845}.close{float:right;background:#252a40;border:1px solid #343a5a;padding:6px 12px;border-radius:16px;cursor:pointer;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}</style></head><body><div class="hdr"><div style="font-weight:800">🔬 Vedanaat Science Hub</div><div id="count" style="font-size:12px;color:#4ade80">1000 Projects</div></div><div class="hero"><h1>Explore • Learn • <span class="y">Create.</span></h1><p style="color:#9aa0b8;font-size:13px;margin-top:6px">India's Biggest Student Science Project Library - Click any for full guide</p><input class="search" id="s" placeholder="Search 1000 projects - solar, robot, arduino, water..." oninput="filt()"><div class="stats"><span>✅ 1000 Projects</span><span>✅ Price + Parts + Steps</span><span>✅ Related Photos</span></div></div><div class="grid" id="grid"></div><div style="text-align:center;padding:20px"><button id="moreBtn" style="background:#2dd4ff;color:#000;border:0;padding:10px 24px;border-radius:20px;font-weight:700;cursor:pointer" onclick="loadMore()">Load More 100 Projects ↓</button></div><div class="modal-bg" id="m" onclick="if(event.target.id==='m')closeM()"><div class="modal"><div style="padding:10px 14px;display:flex;justify-content:space-between;background:#1a1d2d"><span style="font-size:11px;color:#9aa0b8">Project Guide</span><span class="close" onclick="closeM()">✕ Close</span></div><img class="main" id="mi"><div class="modal-body"><h2 id="mt" style="font-size:20px"></h2><div style="margin:8px 0"><span class="badge" id="mc"></span> <span class="price" id="mp"></span></div><p id="md" style="color:#b0b6cc;font-size:13px"></p><div class="section"><h4 style="font-size:12px">🧩 Parts</h4><div id="mcomp"></div></div><div class="section"><h4 style="font-size:12px">🔨 Steps</h4><div id="msteps"></div></div><div class="section" style="background:#1e2a1e"><h4 style="font-size:12px">💡 Tip</h4><p id="mtip" style="font-size:12px;color:#9ab49a"></p></div></div></div></div><script>const cats=[{c:"Physics",img:"https://images.unsplash.com/photo-1509391366360-2e959784a276?w=600",base:["Solar Car","Solar Cooker","Windmill","Electromagnet","Hydraulic Lift","Newton Disc","Periscope","Telescope","Solar Tracker","AC Generator"]},{c:"Robotics",img:"https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600",base:["Robotic Arm","Line Follower","Obstacle Avoider","Pick Place Robot","Humanoid","Drone","Bluetooth Robot","Voice Robot","Fire Fighter Robot","Spy Robot"]},{c:"Environment",img:"https://images.unsplash.com/photo-1581244277943-fe4a9c777189?w=600",base:["Water Filter","Rain Harvesting","Water Level Indicator","Air Pollution Detector","Compost","Biogas Plant","Drip Irrigation","Soil Moisture","Plastic to Fuel","Oxygen Generator"]},{c:"Electronics",img:"https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=600",base:["Smart Home","Auto Light","Fire Alarm","Gas Detector","Door Lock","Plant Watering","Home Security","Smart Dustbin","RFID Lock","Solar Charger"]},{c:"Biology",img:"https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=600",base:["DNA Model","Heart Model","Kidney Model","Photosynthesis","Blood Group","Seed Germination","Mushroom Farming","Hydroponics","DNA Extraction","Lungs Model"]},{c:"Chemistry",img:"https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600",base:["Volcano","Acid Indicator","Soap Making","Crystals","pH Scale","Ink from Waste","Hand Sanitizer","Bioplastic","Fire Extinguisher","Chromatography"]},{c:"AI & Tech",img:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600",base:["Face Detection","Voice Assistant","Chatbot","Smart Attendance","AI Car","Gesture Control","Object Detection","Home AI","Health Monitor","AI Gardener"]}];let projects=[];let id=1;for(let round=0;round<15;round++){cats.forEach(cat=>{cat.base.forEach(name=>{if(projects.length>=1000)return;let title=round===0?name:name+" Model "+id;projects.push({title:title,cat:cat.c,price:`₹${150+(id*17)%800} - ₹${400+(id*23)%1000}`,img:cat.img,desc:`${name} - ${cat.c} project for science exhibition. Low cost, easy to make, with full working explanation. Best for school exhibition.`,components:[[name+" Kit",`₹${80+id%200}`,"Main"],["Wires/Battery","₹50",""],["Cardboard/Base","₹20",""]],steps:["1. Base banao cardboard se","2. Main parts ko glue se fix karo","3. Wiring jodo diagram ke hisab se","4. Battery lagake test karo","5. Chart banao working principle ka","6. Exhibition me demo do"],tip:`${cat.c} principle: ${name} ${cat.c} ke law pe kaam karta hai. Judge ko principle explain karo to full marks.`});id++;});});}let shown=100;const grid=document.getElementById('grid');function render(list){grid.innerHTML='';list.slice(0,shown).forEach((p,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><img src="${p.img}" loading="lazy"><div class="info"><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>${p.price}</p></div></div>`;});document.getElementById('count').innerText=projects.length+" Projects • Showing "+Math.min(shown,list.length);}function openM(i){const p=projects[i];document.getElementById('mi').src=p.img;document.getElementById('mt').innerText=p.title;document.getElementById('mc').innerText=p.cat;document.getElementById('mp').innerText=p.price;document.getElementById('md').innerText=p.desc;document.getElementById('mcomp').innerHTML=p.components.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #242845;font-size:12px"><span>${c[0]}</span><b style="color:#4ade80">${c[1]}</b></div>`).join('');document.getElementById('msteps').innerHTML=p.steps.map(s=>`<div style="padding:6px 0;font-size:12px;border-bottom:1px solid #1e2235">${s}</div>`).join('');document.getElementById('mtip').innerText=p.tip;document.getElementById('m').classList.add('on');}function closeM(){document.getElementById('m').classList.remove('on')}function loadMore(){shown+=100;render(filtered);if(shown>=filtered.length)document.getElementById('moreBtn').style.display='none';}let filtered=projects;function filt(){const q=document.getElementById('s').value.toLowerCase();filtered=q?projects.filter(p=>p.title.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)):projects;shown=100;render(filtered);document.getElementById('moreBtn').style.display=filtered.length>100?'block':'none';}render(filtered);</script></body></html>
