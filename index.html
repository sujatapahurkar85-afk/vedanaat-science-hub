<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedanaat - Edit Photos</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0f18;color:#e8eaf0;font-family:Inter,sans-serif}.hdr{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#0d0f18;border-bottom:1px solid #1e2235;position:sticky;top:0;z-index:20}.btn{border:0;padding:7px 14px;border-radius:20px;font-weight:700;cursor:pointer;font-size:12px}.btn-blue{background:#2dd4ff;color:#000}.btn-green{background:#4ade80;color:#000}.btn-orange{background:#fb923c;color:#000}.hero{margin:12px;background:#1a1d2d;border-radius:14px;padding:16px;border:1px solid #242845}.search{margin-top:8px;background:#252a40;border:1px solid #343a5a;border-radius:8px;padding:8px 12px;width:100%;max-width:500px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px}.card{background:#171a2b;border-radius:10px;overflow:hidden;border:1px solid #242845;cursor:pointer}.card img{width:100%;height:120px;object-fit:cover}.info{padding:6px}.tag{font-size:7px;background:#2a2f4a;padding:2px 5px;border-radius:6px;color:#9aa0b8}.info h3{font-size:10px}.admin-bg,.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:flex-start;z-index:99;overflow:auto;padding:10px}.admin-bg.on,.modal-bg.on{display:flex}.panel{background:#151827;border-radius:14px;max-width:600px;width:100%;border:1px solid #2a2f4a;padding:16px;margin:10px 0;max-height:90vh;overflow:auto}.input{width:100%;background:#252a40;border:1px solid #343a5a;border-radius:6px;padding:8px;color:#fff;margin:5px 0;font-size:11px}.edit-row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #1e2235}.edit-row img{width:40px;height:40px;object-fit:cover;border-radius:6px}.modal{max-width:600px;width:100%;background:#151827;border-radius:14px;border:1px solid #2a2f4a;overflow:hidden}.modal img.main{width:100%;height:220px;object-fit:cover}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:350px){.grid{grid-template-columns:1fr}}</style></head><body><div class="hdr"><div style="font-weight:800;font-size:14px">🔬 Vedanaat Science Hub</div><div style="display:flex;gap:6px"><span id="count" style="font-size:10px;color:#4ade80;align-self:center"></span><button class="btn btn-blue" onclick="openAdmin()">+ Admin - Edit Photos</button></div></div><div class="hero"><h1 style="font-size:22px">Explore • Learn • <span style="color:#facc15">Create.</span></h1><p style="font-size:10px;color:#9aa0b8">Click any project for guide - Admin se photo edit karo</p><input class="search" id="s" placeholder="Search project..." oninput="filt()"></div><div class="grid" id="grid"></div><div style="text-align:center;padding:12px"><button id="moreBtn" class="btn btn-blue" onclick="loadMore()">Load More ↓</button></div>

<div class="admin-bg" id="adminBg"><div class="panel"><div style="display:flex;justify-content:space-between"><h3 style="font-size:14px">🔐 Admin - Add / Edit Photos</h3><span style="cursor:pointer" onclick="closeAdmin()">✕</span></div><div id="loginDiv"><p style="font-size:11px;color:#9aa0b8;margin:6px 0">Password: vedanaat123</p><input class="input" id="pass" type="password" placeholder="Password"><button class="btn btn-blue" style="width:100%;margin-top:6px" onclick="login()">Login</button></div><div id="adminDiv" style="display:none"><div style="display:flex;gap:6px;margin:10px 0"><button class="btn btn-blue" onclick="showTab('add')" id="tabAdd">Add New</button><button class="btn" style="background:#2a2f4a;color:#fff" onclick="showTab('edit')" id="tabEdit">Edit Existing Photos</button></div><div id="addTab"><label style="font-size:10px;color:#9aa0b8">Title *</label><input class="input" id="aTitle" placeholder="e.g. Hydraulic Lift"><label style="font-size:10px;color:#9aa0b8">Image URL * - Google se Copy Image Address</label><input class="input" id="aImg" placeholder="https://...jpg"><input class="input" id="aPrice" placeholder="Price ₹200"><button class="btn btn-green" style="width:100%;margin-top:8px" onclick="addProject()">+ Add New Project</button></div><div id="editTab" style="display:none"><p style="font-size:11px;color:#facc15;margin-bottom:8px">👇 Kisi bhi project ki photo badlo - Edit dabao, naya link paste karo</p><div style="display:flex;gap:6px;margin-bottom:8px"><input class="input" id="editSearch" placeholder="Search project to edit - solar, robot..." oninput="renderEditList()" style="margin:0"><button class="btn btn-orange" onclick="renderEditList()">Search</button></div><div id="editList" style="max-height:400px;overflow:auto"></div></div><div id="myList" style="margin-top:12px;border-top:1px solid #242845;padding-top:8px"></div><button class="btn" style="width:100%;margin-top:10px;background:#2a2f4a;color:#fff" onclick="closeAdmin()">Close</button></div></div></div>

<div class="modal-bg" id="m"><div class="modal"><div style="padding:6px 10px;display:flex;justify-content:space-between;background:#1a1d2d"><span style="font-size:9px">Project Guide</span><span style="cursor:pointer;font-size:11px" onclick="closeM()">✕ Close</span></div><img class="main" id="mi"><div style="padding:12px"><h2 id="mt" style="font-size:14px"></h2><p id="md" style="font-size:11px;color:#b0b6cc;margin:4px 0"></p><div style="margin-top:8px"><input class="input" id="quickEditUrl" placeholder="Paste new image URL here to quickly update"><button class="btn btn-orange" style="width:100%;margin-top:6px" onclick="quickEdit()">🔄 Update This Photo</button></div></div></div></div>

<script>
function getImg(n){n=n.toLowerCase();if(n.includes("solar car"))return "https://images.unsplash.com/photo-1511910849309-0dffb8785146?w=600";if(n.includes("solar"))return "https://images.unsplash.com/photo-1509391366360-2e959784a276?w=600";if(n.includes("wind"))return "https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=600";if(n.includes("hydraulic"))return "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600";if(n.includes("robot"))return "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600";if(n.includes("water")||n.includes("filter"))return "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?w=600";if(n.includes("volcano"))return "https://images.unsplash.com/photo-1506260408121-e353d10b87c7?w=600";if(n.includes("dna")||n.includes("heart"))return "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=600";if(n.includes("smart")||n.includes("arduino"))return "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?w=600";if(n.includes("ai"))return "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600";return "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600";}
const baseNames=["Solar Car","Solar Cooker","Windmill","Electromagnet","Hydraulic Lift","Newton Disc","Periscope","Telescope","Solar Tracker","AC Generator","Solar Water Heater","Electromagnetic Train","Robotic Arm","Line Follower Robot","Obstacle Avoider Robot","Water Filter","Rainwater Harvesting","Water Level Indicator","Air Pollution Detector","Volcano Eruption","Acid Base Indicator","Soap Making","DNA Model","Human Heart Model","Smart Home IoT","Automatic Street Light","Fire Alarm System","Face Detection AI","Voice Assistant","Chatbot Project"];
let baseProjects=[];for(let i=0;i<120;i++){let b=baseNames[i%baseNames.length];let t=i<baseNames.length?b:b+" "+(i+1);baseProjects.push({id:"base_"+i,title:t,cat:"Physics",price:"₹"+(150+i*5),img:getImg(b),desc:t+" - Standard science exhibition project with full guide.",isCustom:false});}
function loadCustom(){try{return JSON.parse(localStorage.getItem("vedanaat_final")||"[]")}catch{return []}}
function saveCustom(a){localStorage.setItem("vedanaat_final",JSON.stringify(a))}
function loadEdits(){try{return JSON.parse(localStorage.getItem("vedanaat_edits")||"{}")}catch{return {}}}
function saveEdits(o){localStorage.setItem("vedanaat_edits",JSON.stringify(o))}
let custom=loadCustom();let edits=loadEdits();
function applyEdits(list){return list.map(p=>{if(edits[p.id])p.img=edits[p.id];return p;});}
baseProjects=applyEdits(baseProjects);
let projects=[...custom,...baseProjects];
let shown=100,filtered=projects,currentIdx=0;
const grid=document.getElementById('grid');
function render(list){grid.innerHTML='';list.slice(0,shown).forEach((p,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><img src="${p.img}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${i}/600/400'"><div class="info"><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>${p.price}</p></div></div>`});document.getElementById('count').innerText=projects.length+" Projects";}
function openM(i){currentIdx=i;const p=filtered[i];document.getElementById('mi').src=p.img;document.getElementById('mt').innerText=p.title;document.getElementById('md').innerText=p.desc;document.getElementById('quickEditUrl').value=p.img;document.getElementById('m').classList.add('on');}
function closeM(){document.getElementById('m').classList.remove('on')}
function loadMore(){shown+=100;render(filtered);if(shown>=filtered.length)document.getElementById('moreBtn').style.display='none';}
function filt(){const q=document.getElementById('s').value.toLowerCase();filtered=q?projects.filter(p=>p.title.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)):projects;shown=100;render(filtered);}
function openAdmin(){document.getElementById('adminBg').classList.add('on');renderEditList();}
function closeAdmin(){document.getElementById('adminBg').classList.remove('on')}
function login(){if(document.getElementById('pass').value==="vedanaat123"){document.getElementById('loginDiv').style.display='none';document.getElementById('adminDiv').style.display='block';}else{alert("Wrong! Password: vedanaat123")}}
function showTab(t){document.getElementById('addTab').style.display=t==='add'?'block':'none';document.getElementById('editTab').style.display=t==='edit'?'block':'none';}
function addProject(){const t=document.getElementById('aTitle').value.trim();const img=document.getElementById('aImg').value.trim();if(!t||!img){alert("Title and Image required");return;}const np={id:"c_"+Date.now(),title:t,cat:"Custom",price:document.getElementById('aPrice').value||"₹200",img:img,desc:t+" - Custom added by admin",isCustom:true};custom.unshift(np);saveCustom(custom);projects=[...custom,...applyEdits(baseProjects)];filtered=projects;alert("Added!");render(filtered);renderEditList();}
function renderEditList(){const q=(document.getElementById('editSearch').value||"").toLowerCase();let list=projects;if(q)list=projects.filter(p=>p.title.toLowerCase().includes(q));document.getElementById('editList').innerHTML=list.slice(0,50).map(p=>`<div class="edit-row"><img src="${p.img}"><div style="flex:1"><div style="font-size:11px">${p.title}</div><div style="font-size:9px;color:#7a819c">${p.id}</div></div><button class="btn btn-orange" onclick="editPhoto('${p.id}')">Edit Photo</button></div>`).join('');document.getElementById('myList').innerHTML="<b style='font-size:11px'>Your Custom Projects: "+custom.length+"</b>"+custom.map(p=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid #222"><span>${p.title}</span><span style="color:#ff5a5a;cursor:pointer" onclick="deleteCustom('${p.id}')">Delete</span></div>`).join('');}
function editPhoto(id){const newUrl=prompt("Naya Photo URL paste karo (Google se Copy Image Address):");if(!newUrl)return;if(id.startsWith("base_")){edits[id]=newUrl;saveEdits(edits);baseProjects=applyEdits(baseProjects);}else{let f=custom.find(p=>p.id===id);if(f){f.img=newUrl;saveCustom(custom);}}projects=[...custom,...baseProjects];filtered=projects;render(filtered);renderEditList();alert("Photo Updated! ✅");}
function quickEdit(){const p=filtered[currentIdx];const newUrl=document.getElementById('quickEditUrl').value.trim();if(!newUrl)return;if(p.id.startsWith("base_")){edits[p.id]=newUrl;saveEdits(edits);baseProjects=applyEdits(baseProjects);}else{let f=custom.find(x=>x.id===p.id);if(f){f.img=newUrl;saveCustom(custom);}}projects=[...custom,...baseProjects];filtered=projects;document.getElementById('mi').src=newUrl;render(filtered);renderEditList();alert("Photo Updated! ✅");}
function deleteCustom(id){custom=custom.filter(p=>p.id!==id);saveCustom(custom);projects=[...custom,...baseProjects];filtered=projects;render(filtered);renderEditList();}
render(filtered);
</script></body></html>
